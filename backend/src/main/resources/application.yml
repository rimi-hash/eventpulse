spring:
  application:
    name: eventpulse-backend
  profiles:
    active: dev

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Custom EventPulse Platform Configuration
eventpulse:
  api-version: v1
  admin:
    email: ${EVENTPULSE_ADMIN_EMAIL:${ADMIN_EMAIL:admin@eventpulse.io}}
    password: ${EVENTPULSE_ADMIN_PASSWORD:${ADMIN_PASSWORD:kaivitradha}}
  seed:
    demo-data: ${SEED_DEMO_DATA:false}
  jwt:
    secret: ${JWT_SECRET:4c696e6775615f4576656e7450756c73655f53757065725f5365637265745f4b65795f32303237}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  ticketing:
    key-id: ${TICKET_KEY_ID:ep-key-2027-v1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  assistant:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout-ms: ${GEMINI_TIMEOUT_MS:10000}

