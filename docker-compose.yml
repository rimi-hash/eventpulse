services:
  postgres:
    image: postgres:16-alpine
    container_name: eventpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eventpulse_db}
      POSTGRES_USER: ${DB_USER:-eventpulse_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventpulse_secure_password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eventpulse_user} -d ${DB_NAME:-eventpulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventpulse-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
